[project]
name = "sih-prototype"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.19.1",
    "easyocr>=1.7.2",
    "email-validator>=2.0.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "opencv-python-headless>=5.0.0.93",
    "passlib[bcrypt]>=1.7.4",
    "pillow>=12.3.0",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "reportlab>=5.0.1",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
]

[tool.pytest.ini_options]
# Only discover tests under tests/. The root-level test_images.py is a
# standalone dev script, not a pytest module: importing it replaces
# sys.stdout/sys.stderr on Windows, which crashes pytest's capture plugin.
testpaths = ["tests"]
